name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-ts:
    name: lint-ts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: TypeScript static checks (SDK, worker, MCP, tests, dashboard)
        run: bun run typecheck

  test-ts:
    name: test-ts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Mount the built dashboard in headless Chrome
        run: bun run test:dashboard

  lint-py:
    name: lint-py
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.10.8
          python-version: '3.12'
          cache-local-path: ${{ runner.temp }}/setup-uv-cache
      - run: uv sync --locked --extra dev --extra langgraph
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy src benchmarks

  test-py:
    name: test-py
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.10.8
          python-version: '3.12'
          cache-local-path: ${{ runner.temp }}/setup-uv-cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: uv sync --locked --extra dev --extra langgraph
      - run: bun install --frozen-lockfile
      - run: uv run --locked pytest -q
      - run: ./scripts/test-e2e.sh

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.10.8
          python-version: ${{ matrix.python }}
          cache-local-path: ${{ runner.temp }}/setup-uv-cache
      - run: uv sync --locked --extra dev --extra langgraph
      - run: uv run --locked pytest -q

  contracts-and-audits:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.21.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.10.8
          python-version: '3.12'
          cache-local-path: ${{ runner.temp }}/setup-uv-cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: uv sync --locked --extra dev --extra langgraph
      - run: bun install --frozen-lockfile
      - run: bun run generate:openapi
      - run: git diff --exit-code -- openapi.json packages/typescript/src/schema.ts
      - run: bun audit
      - run: ./scripts/audit-python.sh
      - run: bun run check:public
      - run: ./scripts/test-packages.sh

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BRAINCORE_IMAGE: braincore-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.10.8
          python-version: '3.12'
          cache-local-path: ${{ runner.temp }}/setup-uv-cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: uv sync --locked --extra dev --extra langgraph
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ./scripts/test-compose-e2e.sh
      - name: Scan the exact locally built image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --disable-telemetry --no-progress --scanners vuln,secret
          --severity HIGH,CRITICAL --exit-code 1
          "$BRAINCORE_IMAGE"
