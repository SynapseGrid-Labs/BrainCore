name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-ts:
    name: lint-ts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: TypeScript static checks (SDK, worker, MCP, tests, dashboard)
        run: bun run typecheck

  test-ts:
    name: test-ts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Mount the built dashboard in headless Chrome
        run: bun run test:dashboard

  lint-py:
    name: lint-py
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.10.8
          python-version: '3.12'
      - run: uv sync --locked --extra dev --extra langgraph
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy src benchmarks

  test-py:
    name: test-py
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.10.8
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: uv sync --locked --extra dev --extra langgraph
      - run: bun install --frozen-lockfile
      - run: uv run --locked pytest -q
      - run: ./scripts/test-e2e.sh

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.10.8
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev --extra langgraph
      - run: uv run --locked pytest -q

  contracts-and-audits:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.21.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.10.8
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: uv sync --locked --extra dev --extra langgraph
      - run: bun install --frozen-lockfile
      - run: bun run generate:openapi
      - run: git diff --exit-code -- openapi.json packages/typescript/src/schema.ts
      - run: bun audit
      - run: ./scripts/audit-python.sh
      - run: bun run check:public
      - run: ./scripts/test-packages.sh

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BRAINCORE_IMAGE: braincore-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.10.8
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: uv sync --locked --extra dev --extra langgraph
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ./scripts/test-compose-e2e.sh
      - name: Scan the exact locally built image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --disable-telemetry --no-progress --scanners vuln,secret
          --severity HIGH,CRITICAL --exit-code 1
          "$BRAINCORE_IMAGE"
