name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.10.8
          python-version: '3.12'
          cache-local-path: ${{ runner.temp }}/setup-uv-cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: uv sync --locked --extra dev --extra langgraph
      - run: bun install --frozen-lockfile
      - run: bun run generate:openapi
      - run: bun run build
      - run: bun audit
      - run: ./scripts/audit-python.sh
      - run: bun run check:public
      - run: npm pack
      - run: uv build --out-dir python-dist
      - run: docker build --tag braincore-candidate:${{ github.sha }} .
      - name: Scan and inventory Full image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --disable-telemetry --no-progress --scanners vuln,secret \
            --severity HIGH,CRITICAL --exit-code 1 \
            braincore-candidate:${{ github.sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --disable-telemetry --no-progress --format cyclonedx \
            --output /out/braincore-2.0.0-full.cdx.json \
            braincore-candidate:${{ github.sha }}
      - name: Record exact image identity
        run: docker image inspect braincore-candidate:${{ github.sha }} --format '{{json .Id}}' > IMAGE-ID.json
      - name: Export candidate hashes
        run: sha256sum python-dist/* *.tgz braincore-2.0.0-full.cdx.json IMAGE-ID.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: braincore-2.0.0-candidate
          path: |
            python-dist/*.whl
            python-dist/*.tar.gz
            *.tgz
            braincore-2.0.0-full.cdx.json
            IMAGE-ID.json
            SHA256SUMS

  publication-is-separate:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "This workflow intentionally does not publish, tag, release, or push an image."
