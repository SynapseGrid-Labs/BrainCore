version: 2
# Version updates wait seven days after a release; security updates are not delayed.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # OpenAPI generation requires the TypeScript 5 compiler API.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Commander majors require reviewing the supported Node.js minimum.
      - dependency-name: commander
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
  # uv updates pyproject.toml and uv.lock together; CI installs with --locked.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
