services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: braincore_test
      POSTGRES_USER: braincore_test
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "127.0.0.1:${BRAINCORE_TEST_DATABASE_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braincore_test -d braincore_test"]
      interval: 1s
      timeout: 3s
      retries: 30
